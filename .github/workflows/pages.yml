# Publishes the app to GitHub Pages (HTTPS, needed for sensors, camera and
# offline install on phones). Enable Settings -> Pages -> Source: GitHub Actions,
# then run this workflow from the Actions tab.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
